# Proxy Rotator Service Configuration

server:
  port: 8080

scanner:
  interval_sec: 600          # How often the scanner runs (10 min)
  sources:
    # Direct APIs (cleanest output)
    - url: "https://api.proxyscrape.com/v4/free-proxy-list/get?request=getproxies&protocol=http&limit=2000"
      format: txt
      protocol: http
    - url: "https://api.proxyscrape.com/v4/free-proxy-list/get?request=getproxies&protocol=socks4&limit=2000"
      format: txt
      protocol: socks4
    - url: "https://api.proxyscrape.com/v4/free-proxy-list/get?request=getproxies&protocol=socks5&limit=2000"
      format: txt
      protocol: socks5
    - url: "https://api.openproxylist.xyz/http.txt"
      format: txt
      protocol: http
    - url: "https://api.openproxylist.xyz/socks4.txt"
      format: txt
      protocol: socks4
    - url: "https://api.openproxylist.xyz/socks5.txt"
      format: txt
      protocol: socks5
    # GitHub raw lists
    - url: "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt"
      format: txt
      protocol: http
    - url: "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks4.txt"
      format: txt
      protocol: socks4
    - url: "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt"
      format: txt
      protocol: socks5
    - url: "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt"
      format: txt
      protocol: http
    - url: "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt"
      format: txt
      protocol: socks5
    - url: "https://raw.githubusercontent.com/jetkai/proxy-list/main/online-proxies/txt/proxies-http.txt"
      format: txt
      protocol: http
    - url: "https://raw.githubusercontent.com/sunny9577/proxy-scraper/master/proxies.txt"
      format: txt
      protocol: mixed
    - url: "https://raw.githubusercontent.com/hookzof/socks5_list/master/proxy.txt"
      format: txt
      protocol: socks5

validator:
  workers: 100                # Concurrent validation goroutines (100 = fast throughput)
  timeout_ms: 5000            # Per-proxy validation timeout (5s)
  probe_url: "http://httpbin.org/ip"
  keepalive_interval_sec: 120 # Re-check ALIVE proxies every 2 min
  max_consecutive_fails: 3    # ALIVE → DEAD after 3 consecutive failures

storage:
  backend: sqlite             # sqlite | json
  path: "./proxies.db"        # File path for sqlite/json

# Built-in proxy sources (these are always loaded)
# Additional sources can be added via PROXY_SOURCES env var (comma-separated URLs)
